# Sample alerts.ini for the bundled demo data. The webhook is a placeholder.
# alerts.ini - what the IT Ops Console tells you about, and where. Safe to edit.
#
# Every line is a yes/no or a number. Change one, save, and the next refresh
# uses it. Blank or 0 on a number turns that rule off. Lines starting with
# ; or # are comments. The Alerts page in the console shows exactly how this
# file was read, including any line it could not use.
#
# Alerts carry the same names the console shows (admin accounts, licence
# holders, printer names). Send them to a channel whose members should see
# that. Nothing in this file is a password; the Teams URL below lets anyone
# who has it post into that channel, which is why this folder is locked to
# you and Administrators. Prefer not to keep it in a file at all? Leave it
# blank and set the ITOPS_TEAMS_WEBHOOK environment variable instead
# (machine scope, if the refresh runs unattended).

[send]
; changes       = a message only when an alert appears, gets worse, or clears
; every-refresh = a summary after every refresh, even when nothing changed
when = changes
; A weekly summary of everything still open, on this day (blank = never).
digest_day = Monday
; Optional: where people open the console - a URL or a \\server\share path.
; Shown at the bottom of every alert.
console_link = https://intranet.example.com/it-console/

[teams]
; Your channel's Workflows URL. In Teams: channel > ... > Workflows >
; "Post to a channel when a webhook request is received" > copy the URL.
; Test it: python notify.py --test   (from the console folder)
webhook = https://prod-00.westus.logic.azure.com:443/workflows/EXAMPLE-not-a-real-url

[email]
; An internal mail relay that accepts mail from this computer without a
; password. Blank = no email. (A relay that needs a login is not supported
; here on purpose - there are no password fields anywhere in this suite.)
smtp_server =
port = 25
from =
; One or more addresses, separated by ;
to =
use_ssl = no

[identity]
; Identity tab. notify = no silences every rule below without changing them.
notify = yes
; A critical Conditional Access gap - A must-have sign-in protection is missing (MFA for everyone, legacy auth blocked, admins covered).
ca_gap_critical = yes
; A Conditional Access gap worth a look - Weaker gaps: report-only policies lingering, guests uncovered, unused locations.
ca_gap_warning = no
; An app credential has expired - A registered app's secret or certificate is past its date - whatever uses it has stopped working.
app_credential_expired = yes
; An app credential expires within (days) - Warn this many days ahead. 0 turns it off.
app_credential_expiring_days = 30

[security]
; Security tab. notify = no silences every rule below without changing them.
notify = yes
; An admin has no MFA - Any account holding an admin role with no MFA method registered.
admin_without_mfa = yes
; MFA coverage falls below (%) - Percent of enabled people with an MFA method. 0 turns it off.
mfa_coverage_below = 90
; Stale accounts exceed (accounts) - Accounts with no sign-in for the stale period. 0 turns it off.
stale_accounts_above = 20
; Legacy authentication is still being used - Sign-ins over old protocols that cannot do MFA (needs the sign-in log to be available).
legacy_auth_signins = yes

[licensing]
; Licensing tab. notify = no silences every rule below without changing them.
notify = yes
; A disabled account still holds a license - Money leaking with no conversation needed.
disabled_account_licensed = yes
; Unassigned paid seats exceed (seats) - Seats you pay for that nobody holds. 0 turns it off.
unused_seats_above = 25
; Unused seats cost more per month than ($) - Needs prices.ini filled in. 0 turns it off.
unused_monthly_cost_above = 0

[fleet]
; Print fleet tab. notify = no silences every rule below without changing them.
notify = yes
; A printer is offline - It stopped answering for two days.
device_offline = yes
; A printer reports an error - Jam, door open, out of toner - whatever its panel says.
device_error = yes
; A toner or drum falls below (%) - Per supply, per printer. 0 turns it off.
supply_below_percent = 10

[changes]
; What changed tab. notify = no silences every rule below without changing them.
notify = yes
; A Conditional Access policy was added, removed or changed - Reported once, when it appears in the change log.
conditional_access = yes
; An admin role was granted or removed - Reported once.
role_assignments = yes
; An app registration was added or removed - Reported once.
app_registrations = no
; Purchased license counts changed - Reported once.
licenses = no
; An Intune policy or profile changed - Reported once.
intune = no
; Only changes newer than this many days can be reported (avoids a flood on the first run).
recent_days = 3

[refresh]
; Refresh tab. notify = no silences every rule below without changing them.
notify = yes
; The automatic refresh could not sign in - Or had to fall back to a different sign-in route.
could_not_sign_in = yes
; A collector did not complete - One of the tools failed, so its page shows older data.
collector_failed = yes
; The refresh certificate expires within (days) - Unattended refresh only. Expired is always reported. 0 turns the warning off.
certificate_expiring_days = 30
; Any page's data is older than (days) - Whatever the reason, the numbers are no longer current. 0 turns it off.
data_stale_days = 3
