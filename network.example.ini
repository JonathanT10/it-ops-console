# it-ops-console - network health over SNMPv3.
#
# Copy this file to network.ini (beside run-all.ps1) and list your switches and
# access points. The next "Refresh IT Ops Data" picks it up on its own; while
# network.ini is missing or still identical to this example, the network step
# is skipped and says so.
#
# NO PASSWORDS GO IN THIS FILE. Each site names a credential; the user name
# and password for it are saved, encrypted by Windows, by running
# set-network-credential.ps1 once per site from a PowerShell window opened
# with "Run as administrator" on the computer that refreshes the console.
# The values themselves are in LastPass - this file only ever names a site.
#
# The addresses below are placeholders. Replace them with your own.

[snmp]
# Seconds to wait for one answer, and how many times to ask again.
timeout = 2
retries = 1
# Hard ceiling for one device's whole exchange, in seconds.
device_timeout = 20
# How many devices are asked at the same time.
poll_at_once = 8
# SNMPv3 context name. UniFi gear uses none - leave it blank.
context =

# One section per site: [site:<name>]. "credential" names the saved
# credential to use (set-network-credential.ps1 asks for the same name);
# every other line is  Device name = address
[site:dfw]
credential = dfw
DFW Core Switch = 10.0.10.2
DFW Floor 2 Switch = 10.0.10.3

[site:hou]
credential = hou
HOU Core Switch = 10.0.10.20

# Uplinks: the ports whose loss cuts a switch (or a whole site) off. Listed as
# interface numbers (ifIndex) per device address. A down uplink is an alert; an
# ordinary desk port going down is not.
[uplinks]
10.0.10.2 = 49,50
10.0.10.20 = 25
