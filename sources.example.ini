# it-ops-console - where your tools' output lives.
#
# Copy this file to sources.ini and edit the paths. Relative paths are resolved
# against base_path; base_path itself is resolved against this file's folder, so
# the console builds the same whether you run it by hand or from a scheduled
# task whose working directory is somewhere else entirely.
#
# Every source is optional. Leave a line blank and that tool simply gets no
# page - the console does not pretend the data exists.

[console]
# Common parent for the paths below. Comment it out and use absolute paths
# in [sources] instead if your tools write to unrelated locations.
base_path = C:\it-ops\output

[sources]

# --- entra-tenant-docs ---------------------------------------------------- #
# Export-EntraTenantDocs.ps1 -OutputPath C:\it-ops\output\tenant-docs
#   tenant.json       the full tenant snapshot  -> Identity page
#   run-summary.json  this run's delta + CA gap analysis
#   history\          archived snapshots        -> What changed page
tenant      = tenant-docs\tenant.json
run_summary = tenant-docs\run-summary.json
history     = tenant-docs\history

# --- entra-security-snapshot ---------------------------------------------- #
# Get-EntraSecuritySnapshot.ps1 -JsonPath C:\it-ops\output\security-snapshot.json
security    = security-snapshot.json

# --- m365-license-waste-report -------------------------------------------- #
# Get-LicenseWasteReport.ps1 -JsonPath C:\it-ops\output\licensing.json
licensing   = licensing.json

# --- print-fleet-dashboard ------------------------------------------------ #
# The collector's SQLite database. Opened read-only; the console never writes
# to it, so it is safe to point at the live file the collector is appending to.
fleet       = C:\it-ops\print-fleet\fleet.db
